<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Back to the app | MD Fit</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0A1A2E; color: #fff; font-family: Montserrat, system-ui, -apple-system, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { font: 700 24px/1.2 "Libre Baskerville", Georgia, serif; margin: 18px 0 8px; }
    p { color: #b9c3d3; margin: 0 0 22px; }
    a.btn { display: inline-block; background: #C8A763; color: #0A1A2E; font-weight: 700; padding: 14px 26px; border-radius: 999px; text-decoration: none; }
    a.alt { display: block; margin-top: 18px; color: #8EC0E6; }
  </style>
  <link rel="stylesheet" href="/site-header.css?v=f429a526">
  <script src="/site-header.js?v=312f6631" defer></script>
</head>
<body>
  <!-- site-header: generated by scripts/site-header.js, edit it there -->
  <header class="sh" id="top">
    <div class="sh-inner">
      <a href="/" class="sh-brand" aria-label="MD Fit home"><img src="/assets/logo.webp" alt="MD Fit" width="160" height="160"><span class="sh-sub">Physical Rehab &amp; Fitness</span></a>
      <button class="sh-menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sh-menu"><span></span><span></span><span></span></button>
      <nav class="sh-menu" id="sh-menu" aria-label="Main">
        <a href="/conditions/">Conditions</a>
        <a href="/treatments/">Treatments</a>
        <a href="/areas/">Areas</a>
        <a href="/blog/">Blog</a>
        <a href="/dr-jared">Dr. Jared</a>
        <a href="/testimonials">Reviews</a>
        <a href="/events">Events</a>
        <a href="tel:+19413130562" class="sh-phone" data-phone-link>941-313-0562</a>
        <a href="/login" class="sh-app" data-account-link>Open the free app</a>
        <a href="/book" class="sh-book">Book evaluation</a>
      </nav>
    </div>
  </header>
  <!-- /site-header -->
  <main>
    <div>
      <img src="/assets/logo.webp" alt="MD Fit">
      <h1 id="h">Taking you back to the app…</h1>
      <p id="p">If nothing happens, tap the button.</p>
      <a class="btn" id="go" href="/account">Return to the MD Fit app</a>
      <a class="alt" id="web" href="/account">Continue on the website instead</a>
    </div>
  </main>
  <script>
    // Stripe (or the billing portal) sends the app's checkout here. We bounce to mdfit://checkout?… which the
    // MD Fit app registers; the sheet closes and the app opens the page the payment was about.
    (function () {
      var q = new URLSearchParams(location.search);
      var to = q.get("to") || "/account#premium";
      if (to.charAt(0) !== "/" || to.indexOf("//") === 0) to = "/account#premium";
      var sid = q.get("session_id");
      if (sid) to = to.replace("session_id=SESSION", "session_id=" + encodeURIComponent(sid));
      var cancelled = q.get("cancel") === "1";
      if (cancelled) { document.getElementById("h").textContent = "Checkout cancelled"; document.getElementById("p").textContent = "No charge was made."; }
      var app = "mdfit://checkout?" + (cancelled ? "cancel=1&" : "") + "to=" + encodeURIComponent(to);
      document.getElementById("go").href = app;
      document.getElementById("web").href = to;
      location.replace(app);
    })();
  </script>
</body>
</html>
