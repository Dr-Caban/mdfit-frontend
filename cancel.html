<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/nozoom.js?v=45d3b173"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>Cancel Booking | MD Fit</title>
  <link rel="icon" href="assets/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1ea07fc8">
  <style>
    /* The shared header sits on top; the card is centred below it (a grid on body would centre the header too) */
    body { background: var(--ink); min-height: 100vh; margin: 0; }
    .form { width: min(440px, 100% - 32px); margin: clamp(24px, 10vh, 96px) auto 32px; text-align: center; justify-items: center; }
    .form h1 { font: 700 28px/1.2 var(--display); color: var(--heading); margin: 6px 0 0; }
    .form .btn { justify-self: center; }
  </style>
  <link rel="stylesheet" href="/site-header.css?v=f429a526">
  <script src="/site-header.js?v=312f6631" defer></script>
</head>
<body>
  <!-- site-header: generated by scripts/site-header.js, edit it there -->
  <header class="sh" id="top">
    <div class="sh-inner">
      <a href="/" class="sh-brand" aria-label="MD Fit home"><img src="/assets/logo.webp" alt="MD Fit" width="160" height="160"><span class="sh-sub">Physical Rehab &amp; Fitness</span></a>
      <button class="sh-menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sh-menu"><span></span><span></span><span></span></button>
      <nav class="sh-menu" id="sh-menu" aria-label="Main">
        <a href="/conditions/">Conditions</a>
        <a href="/treatments/">Treatments</a>
        <a href="/areas/">Areas</a>
        <a href="/blog/">Blog</a>
        <a href="/#dr">Dr. Jared</a>
        <a href="/#reviews">Reviews</a>
        <a href="/events">Events</a>
        <a href="tel:+19413130562" class="sh-phone" data-phone-link>941-313-0562</a>
        <a href="/login" class="sh-app" data-account-link>Open the app</a>
        <a href="/book" class="sh-book">Book evaluation</a>
      </nav>
    </div>
  </header>
  <!-- /site-header -->
  <div class="form">
    <h1>Cancel booking</h1>
    <p class="muted" id="what">Need to cancel? Tap below and the time is released for someone else.</p>
    <button class="btn btn-lg" id="go">Yes, cancel it</button>
    <p class="form-msg" role="status"></p>
    <a href="/book" class="btn btn-line" id="rebook" hidden>Book a new time</a>
  </div>
  <script src="config.js?v=aac711e3"></script>
  <script src="analytics.js?v=f3f61f9e" defer></script>
  <script>
    (() => {
      const API = window.MDFIT_CONFIG.apiUrl.replace(/\/+$/, "");
      const q = new URLSearchParams(location.search);
      const kind = q.get("kind"), id = q.get("id"), token = q.get("token");
      const btn = document.getElementById("go"), msg = document.querySelector(".form-msg");
      const path = kind === "appointment" ? "appointments" : kind === "class" ? "bookings" : null;
      if (!path || !/^[a-f0-9]{12}$/.test(id || "") || !token) {
        btn.hidden = true;
        msg.className = "form-msg err";
        msg.textContent = "This cancel link is incomplete. Please call 941-313-0562.";
        return;
      }
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          const res = await fetch(`${API}/api/${path}/${id}/cancel`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "Couldn't cancel. Please call 941-313-0562.");
          btn.hidden = true;
          msg.className = "form-msg ok";
          msg.textContent = "Cancelled. We hope to see you soon.";
          document.getElementById("rebook").hidden = false;
        } catch (err) {
          btn.disabled = false;
          msg.className = "form-msg err";
          msg.textContent = err.message;
        }
      });
    })();
  </script>
</body>
</html>
