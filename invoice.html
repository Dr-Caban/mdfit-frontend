<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script src="/nozoom.js?v=45d3b173"></script>
  <meta name="robots" content="noindex, nofollow">
  <title>Your invoice | MD Fit</title>
  <meta name="description" content="Pay your MD Fit invoice securely by card.">
  <link rel="icon" href="assets/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3e518721">
  <style>
    /* The shared header sits on top; the card is centred below it (a grid on body would centre the header too) */
    body { background: var(--ink); min-height: 100vh; margin: 0; }
    .form { width: min(440px, 100% - 32px); margin: clamp(24px, 10vh, 96px) auto 32px; text-align: center; justify-items: center; }
    .form h1 { font: 700 28px/1.2 var(--display); color: var(--heading); margin: 6px 0 0; }
    .form .btn { justify-self: center; }
    .inv-amount { font-size: 40px; font-weight: 800; line-height: 1.1; color: var(--heading); margin: 4px 0 0; font-variant-numeric: tabular-nums; }
    .inv-note { white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; background: rgba(10,26,46,.05); border-radius: 12px; padding: 12px 14px; margin: 0; width: 100%; box-sizing: border-box; }
    .inv-paid { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ok); }
  </style>
  <link rel="stylesheet" href="/site-header.css?v=f429a526">
  <script src="/site-header.js?v=312f6631" defer></script>
</head>
<body>
  <!-- site-header: generated by scripts/site-header.js, edit it there -->
  <header class="sh" id="top">
    <div class="sh-inner">
      <a href="/" class="sh-brand" aria-label="MD Fit home"><img src="/assets/logo.webp" alt="MD Fit" width="160" height="160"><span class="sh-sub">Physical Rehab &amp; Fitness</span></a>
      <button class="sh-menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sh-menu"><span></span><span></span><span></span></button>
      <nav class="sh-menu" id="sh-menu" aria-label="Main">
        <a href="/conditions/">Conditions</a>
        <a href="/treatments/">Treatments</a>
        <a href="/areas/">Areas</a>
        <a href="/blog/">Blog</a>
        <a href="/#dr">Dr. Jared</a>
        <a href="/#reviews">Reviews</a>
        <a href="/events">Events</a>
        <a href="tel:+19413130562" class="sh-phone" data-phone-link>941-313-0562</a>
        <a href="/login" class="sh-app" data-account-link>Open the app</a>
        <a href="/book" class="sh-book">Book evaluation</a>
      </nav>
    </div>
  </header>
  <!-- /site-header -->
  <div class="form">
    <h1 id="title">Your invoice</h1>
    <p class="muted" id="who"></p>
    <p class="inv-amount" id="amount" hidden></p>
    <p class="inv-note" id="note" hidden></p>
    <button class="btn btn-lg" id="go" hidden>Pay by card</button>
    <p class="inv-paid" id="paid" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Paid. Thank you.</span></p>
    <p class="form-msg" role="status"></p>
    <p class="muted" style="font-size:13px">Card payments are taken on Stripe's secure page. Questions? Call <a href="tel:+19413130562">941-313-0562</a>.</p>
  </div>
  <script src="config.js?v=aac711e3"></script>
  <script src="invoice.js?v=5ae68404"></script>
</body>
</html>
