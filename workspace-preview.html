<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Fit — Practice Workspace (preview)</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="A preview of the MD Fit practice workspace screens. Not connected to a database; nothing entered here is saved.">
<!--
  PRACTICE WORKSPACE — FRONTEND PREVIEW (no backend, no data)
  ------------------------------------------------
  • Single file: HTML + CSS + vanilla JS. No build step.
  • There is no sample data. The DATA section of the <script> holds empty lists that
    API calls will fill (search for "TODO(api)"). Every screen shows an empty state.
  • Nothing is connected: every action reports that it is a preview and saves nothing.
  • Views are hash-routed: #dashboard, #calendar, #clients, #chart, #notes, #messages,
    #telehealth, #forms, #programs, #nutrition, #fitness, #payments, #reports,
    #team, #security, #settings, #portal, #booking
  • The chart, nav and messages are written to change by discipline, role and
    sensitivity tier once there are users and records to show.
  • PWA: add manifest.json + service worker in production (see installModal()).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: calm clinical workspace — slim nav rail, dense cards, color = discipline */
:root{
  /* MD Fit brand, inverted for a workspace: the marketing site is navy with light-blue
     accents; this is white with lighter blues, and navy only for text. Values are the
     site's own tokens (styles.css). To white-label for another practice, change this block. */
  --bg:#F5F9FC; --surface:#FFFFFF; --ink:#0A1A2E; --muted:#5B6B7C; --line:#DCE8F2;
  --accent:#7AAFD7; --accent-soft:#EAF3FA; --accent-ink:#0A1A2E;
  --accent-text:#2F6E9E;   /* light blue fails contrast as text on white; this is the brand's AA blue */
  --wash:#F0F6FB;          /* the lightest blue, for hovers and quiet panels */
  --bh:#6B4FB8; --med:#C2412D; --nut:#2E8540; --fit:#C8862B; --body:#2F6E9E;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#C62828;
  --font-display:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --font-body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(10,26,46,.05),0 6px 18px -8px rgba(10,26,46,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1A2E; --surface:#10233B; --ink:#E8F0F7; --muted:#9BB0C4; --line:#1D3352;
  --accent:#8EC0E6; --accent-soft:#16304D; --accent-ink:#0A1A2E; --accent-text:#8EC0E6; --wash:#132A45;
  --bh:#A28BE6; --med:#EE7D68; --nut:#6CC47E; --fit:#F0A55B; --body:#8EC0E6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A1A2E; --surface:#10233B; --ink:#E8F0F7; --muted:#9BB0C4; --line:#1D3352;
  --accent:#8EC0E6; --accent-soft:#16304D; --accent-ink:#0A1A2E; --accent-text:#8EC0E6; --wash:#132A45;
  --bh:#A28BE6; --med:#EE7D68; --nut:#6CC47E; --fit:#F0A55B; --body:#8EC0E6; color-scheme:dark;}

.demo-bar{background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700}
.brand b{font-family:var(--font-display);font-size:18px}
.nav-group{padding:8px 10px}
.nav-group>span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--bg)}
.nav a.active{background:var(--accent-soft);color:var(--accent-text)}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .badge{margin-left:auto}
.nav-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:12px}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.search input{border:0;background:transparent;outline:none;width:100%}
.top .spacer{flex:1}
.view{overflow-y:auto;padding:24px;flex:1}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-head p{margin:4px 0 0}

/* Primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
a.btn{text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
#roleSel{max-width:300px}
.btn.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:transparent}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:transparent}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:transparent}
.pill.accent{color:var(--accent-text);background:var(--accent-soft);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.disc{--c:var(--accent);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-color:transparent}
.d-bh{--c:var(--bh)}.d-med{--c:var(--med)}.d-nut{--c:var(--nut)}.d-fit{--c:var(--fit)}.d-body{--c:var(--body)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.table-wrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea.input{min-height:120px;resize:vertical;line-height:1.55}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 12px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi small{font-size:12px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .pill{white-space:normal;text-align:right}
.toggle{position:relative;width:36px;height:20px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s}
.toggle span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{left:18px}
.locked{border:1px dashed var(--line);border-radius:8px;padding:14px;display:flex;gap:10px;align-items:flex-start;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--muted) 5%,transparent) 8px 16px)}
.locked svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;margin-top:2px}
.tier{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.t0{color:var(--muted)}.t1{color:var(--accent-text)}.t2{color:var(--warn)}.t3{color:var(--bad)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* Calendar */
.cal{display:grid;grid-template-columns:56px repeat(5,minmax(120px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:720px}
.cal-h{padding:10px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;border-left:1px solid var(--line)}
.cal-h.today{color:var(--accent-text)}
.cal-times{display:grid;grid-template-rows:repeat(20,28px)}
.cal-times div{font-size:11px;color:var(--muted);padding:0 6px;text-align:right;transform:translateY(-7px)}
.cal-col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 55px,var(--line) 55px 56px)}
.appt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;cursor:pointer;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));overflow:hidden}
.appt b{display:block;font-weight:600}
.appt:hover{filter:brightness(.97)}

/* Chat */
.chat{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 190px);min-height:420px}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.thread{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.thread.active{background:var(--accent-soft)}
.msgs{display:flex;flex-direction:column}
.msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:70%;padding:9px 12px;border-radius:12px;background:var(--bg)}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

/* Telehealth */
.video{position:relative;background:#0A1A2E;border-radius:14px;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;color:#cfe}
.video .self{position:absolute;right:14px;bottom:14px;width:22%;aspect-ratio:16/10;border-radius:10px;background:#244;display:grid;place-items:center;font-size:12px;border:2px solid rgba(255,255,255,.2)}
.video .label{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:6px;font-size:12px}
.video .timer{position:absolute;left:14px;top:14px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:6px;font-size:12px}
.vcontrols{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.vbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.vbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vbtn.end{background:var(--bad);color:#fff;border-color:var(--bad);width:64px;border-radius:22px}
.vbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Phone */
.phone{width:320px;max-width:100%;border-radius:36px;border:10px solid #0A1A2E;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);margin:0 auto}
.phone-screen{height:620px;overflow-y:auto;padding:18px 16px}
.phone-bar{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:10px 0;background:var(--surface);font-size:11px;color:var(--muted)}

/* Forms builder */
.palette button{width:100%;justify-content:flex-start}
.canvas-field{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.canvas-field .grip{color:var(--muted);cursor:grab;user-select:none}

/* Modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(10,26,46,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal-back.open{display:grid}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60;font-weight:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mobile-nav-btn{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:1fr}}
.form-grid{grid-template-columns:200px minmax(0,1fr) 260px}
.form-grid>*{min-width:0}
.main,.view{min-width:0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)!important}
  .view>*{max-width:100%}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .card{overflow-x:auto}
  .table-wrap{overflow-x:auto;max-width:100%}
  .app{grid-template-columns:1fr}
  .nav{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:.2s}
  .nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .mobile-nav-btn{display:inline-flex}
  .g2,.g3,.g4,.g-side{grid-template-columns:minmax(0,1fr)}
  .chat{grid-template-columns:1fr}.threads{display:none}
  .view{padding:16px}.top{padding:10px 16px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="main">
    <div class="demo-bar" role="note"><b>Preview.</b> These screens are not connected to a database yet. Nothing you enter is saved and no feature here is live. Please do not enter patient information.</div>
    <header class="top">
      <button class="btn ghost mobile-nav-btn" id="navToggle" aria-label="Open menu">☰</button>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="globalSearch" placeholder="Search clients, notes, invoices…  (Ctrl K)"></div>
      <div class="spacer"></div>
      <span class="pill warn" title="A preview of the screens. Not connected to a database, so nothing is saved.">Preview · not connected</span>
      <button class="btn sm" id="installBtn">⤓ Install app</button>
      <div class="field" style="flex-direction:row;align-items:center;gap:6px">
        <label for="roleSel" style="margin:0">Viewing as</label>
        <select id="roleSel" class="input" style="width:auto;padding:5px 8px"></select>
      </div>
      <button class="btn ghost sm" id="themeBtn" aria-label="Toggle theme">◐</button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* =========================================================================
   DATA — empty until the API is connected. Fill each block from API calls. TODO(api)
   ========================================================================= */
const DISC = {
  bh:{label:"Behavioral Health",short:"Therapy"},
  med:{label:"Psychiatry / Medical",short:"Medical"},
  nut:{label:"Nutrition",short:"Nutrition"},
  fit:{label:"Fitness / Coaching",short:"Fitness"},
  body:{label:"Bodywork / Rehab",short:"Bodywork"}
};
const PRACTICE = {name:"MD Fit",locations:[],modules:{bh:true,med:true,nut:true,fit:true,body:true},ai:true};

const USERS = [
  {id:"u1",name:"Practice owner",cred:"",role:"Owner",disc:["body","fit","nut","bh","med"],color:"#2F6E9E"}
];

const CLIENTS = [];

// tier: 0 client-visible, 1 standard clinical, 2 restricted (author only), 3 specially protected
const NOTES = [];

const APPTS = [];
/* The current working week, from the real date. TODAY is 0–4 on weekdays and 5–6 at the weekend, when no column is highlighted. */
const NOW = new Date();
const WEEK0 = (()=>{const d=new Date(NOW);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;})();
const DAYS = Array.from({length:5},(_,i)=>{const d=new Date(WEEK0);d.setDate(d.getDate()+i);return d.toLocaleDateString("en-US",{weekday:"short"})+" "+d.getDate();});
const TODAY = (NOW.getDay()+6)%7;

const THREADS = [];

const INVOICES = [];
const PACKAGES = [];
const PROGRAMS = [];
const AUDIT = [];
const VENDORS = [
  {n:"Cloud hosting",baa:null},{n:"Database",baa:null},{n:"File storage",baa:null},
  {n:"Key management",baa:null},{n:"Email and text provider",baa:null},{n:"Video (telehealth)",baa:null},
  {n:"AI model provider",baa:null},{n:"Payments",baa:null}
];

/* =========================================================================
   STATE + HELPERS
   ========================================================================= */
const state = {user:"u1", chartClient:null, chartTab:"overview", thread:null, formFields:null, noteTemplate:"SOAP", portalTab:"home", bookStep:0, book:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const user = id => USERS.find(u=>u.id===id);
const client = id => CLIENTS.find(c=>c.id===id);
const me = () => user(state.user);
const initials = n => n.split(" ").filter(w=>/^[A-Z]/.test(w)).map(w=>w[0]).slice(0,2).join("");
const av = (u,size=32) => `<span class="avatar" style="background:${u.color};width:${size}px;height:${size}px">${initials(u.name)}</span>`;
const cav = (c,size=32) => `<span class="avatar" style="background:#8FA3B8;width:${size}px;height:${size}px">${initials(c.name)}</span>`;
const discPill = d => `<span class="pill disc d-${d}">${DISC[d].short}</span>`;
const money = n => "$"+n.toLocaleString("en-US",{minimumFractionDigits:0});
const isAdmin = () => me().role==="Owner";
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}
function modal(html){$("#modal").innerHTML=html;$("#modalBack").classList.add("open");$("#modal").querySelector("button,input,select,textarea")?.focus();}
function closeModal(){$("#modalBack").classList.remove("open");}
$("#modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#globalSearch").focus();}});
const lockIcon = `<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;

/* -------- ACCESS RULES (mirror these on the server!) --------------------
   canSeeNote(): discipline + consent + sensitivity tier. TODO(api): enforce in RLS. */
function canSeeNote(n){
  const u = me(), c = client(n.client);
  if(n.tier===2) return {ok:n.author===u.id, why:"Restricted psychotherapy note · only the author can read it"};
  if(n.tier===3) return {ok:false, why:"42 CFR Part 2 protected · needs specific written consent or break-glass"};
  if(!c.team.includes(u.id) && u.role!=="Owner") return {ok:false, why:"You are not on this client's care team"};
  if(u.disc.includes(n.disc)) return {ok:true};
  if(u.supervisor && n.disc==="bh") return {ok:true};
  if(n.disc==="bh" && u.disc.includes("med") && c.consent.bh_to_med) return {ok:true, via:"Shared via client consent (Therapy → Psychiatry)"};
  if(n.disc==="nut" && u.disc.includes("fit") && c.consent.nut_to_fit) return {ok:true, via:"Shared via client consent (Nutrition → Fitness)"};
  if(u.disc.length===0) return {ok:false, why:"Front-desk roles see demographics, scheduling and billing only"};
  return {ok:false, why:`${DISC[n.disc].label} notes are hidden from ${DISC[u.disc[0]]?.short||"this"} providers unless the client consents`};
}

function measureCard(title,vals,max){
  const W=320,H=120,p=22, step=(W-2*p)/Math.max(vals.length-1,1);
  const pts=vals.map((v,i)=>[p+i*step,H-p-(v/max)*(H-2*p)]);
  const path=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
  const area=path+` L${pts.at(-1)[0]},${H-p} L${p},${H-p} Z`;
  const last=vals.at(-1), first=vals[0];
  return `<div class="card"><div class="card-head"><h2>${title}</h2><span class="pill ${last<first?"ok":"warn"}">${last} now · ${last<first?"↓":"↑"}${Math.abs(first-last)}</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${title} trend">
    ${[0,.5,1].map(f=>`<line x1="${p}" x2="${W-p}" y1="${H-p-f*(H-2*p)}" y2="${H-p-f*(H-2*p)}" stroke="var(--line)"/><text x="2" y="${H-p-f*(H-2*p)+4}" font-size="10" fill="var(--muted)">${Math.round(f*max)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="${i===pts.length-1?4.5:2.5}" fill="var(--accent)"/>`).join("")}
  </svg><div class="muted" style="font-size:12px">Last ${vals.length} submissions</div></div>`;
}

  ${USERS.map(u=>`<tr><td><div class="row">${av(u,28)}<div><b>${esc(u.name)}</b> <span class="muted">${esc(u.cred)}</span></div></div></td><td>${esc(u.role)}</td><td>${u.disc.map(discPill).join(" ")||`<span class="muted">—</span>`}</td><td class="muted">All</td><td><span class="pill">Not set up</span></td></tr>`).join("")}</tbody></table></div></div>
  <div class="card"><div class="card-head"><h2>Permission matrix</h2><span class="muted" style="font-size:12px">The planned default for each role</span></div><div class="table-wrap"><table><thead><tr><th>Role</th>${perms.map(p=>`<th>${p}</th>`).join("")}</tr></thead><tbody>
  ${Object.entries(roles).map(([r,v])=>`<tr><td><b>${r}</b></td>${v.map((on,i)=>`<td><label class="toggle"><input type="checkbox" ${on?"checked":""} aria-label="${r}: ${perms[i]}" onchange="notLive()"><span></span></label></td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="muted" style="font-size:12px;margin:10px 0 0">Other disciplines' notes stay off for every role. They are meant to open only through client consent or break-glass access.</p></div>`;
};

V.security = () => `
  <div class="view-head"><div><h1>Security & audit</h1><p class="muted"><b>Nothing on this screen is set up yet.</b> It shows where each control will appear once the system is connected.</p></div><button class="btn danger" onclick="breakGlass()">Break-glass access</button></div>
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card"><h2 style="margin-bottom:10px">Encryption</h2>${["In transit","At rest","Keys","Restricted notes"].map(k=>`<div class="list-item"><span style="flex:1">${k}</span><span class="pill">Not set up</span></div>`).join("")}</div>
    <div class="card"><h2 style="margin-bottom:10px">Sensitivity tiers</h2>${[["T0","Client-visible","Appointments, invoices, shared plans"],["T1","Standard clinical","Treating discipline only"],["T2","Restricted","Psychotherapy notes · author only"],["T3","Specially protected","Part 2, HIV, reproductive, minors' confidential notes"]].map(([t,n,d],i)=>`<div class="list-item"><span class="tier t${i}">${t}</span><div><b>${n}</b><div class="muted" style="font-size:12px">${d}</div></div></div>`).join("")}</div>
    <div class="card"><h2 style="margin-bottom:10px">Vendor agreements (BAAs)</h2>${VENDORS.map(v=>`<div class="list-item"><span style="flex:1">${esc(v.n)}</span><span class="pill ${v.baa===true?"ok":""}">${v.baa===true?"BAA signed":"Not signed"}</span></div>`).join("")}</div>
  </div>
  <div class="card" style="padding:0"><div class="card-head" style="padding:14px 16px 0"><h2>Audit log</h2></div>
  <div class="table-wrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Record</th><th>Tier</th><th>IP</th></tr></thead><tbody>
  ${AUDIT.map(a=>`<tr><td class="num">${esc(a.t)}</td><td>${esc(user(a.u)?.name||"")}</td><td><span class="pill ${a.a==="Denied"?"warn":a.a==="Break-glass"?"bad":""}">${esc(a.a)}</span></td><td>${esc(a.o)}</td><td><span class="tier t${a.tier}">T${a.tier}</span></td><td class="num muted">${esc(a.ip)}</td></tr>`).join("")||noneRow(6,"No activity recorded. Audit logging is not connected yet.")}</tbody></table></div></div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2 style="margin-bottom:10px">Session & device policy</h2>${["Require two-step sign-in","Sign out after 15 minutes idle","Remote sign-out for lost devices","Hide health details from notifications"].map(l=>`<div class="list-item"><span style="flex:1">${l}</span><span class="pill">Not set up</span></div>`).join("")}</div>
    <div class="card"><h2 style="margin-bottom:10px">Records requests</h2><p class="muted" style="margin-top:0">Planned: generate a chart packet for a client or authorized party, leaving out T2 notes automatically and requiring the client's specific consent for T3 records.</p><button class="btn" onclick="notLive()">New records release</button></div>
  </div>`;

V.settings = () => `
  <div class="view-head"><div><h1>Modules & settings</h1><p class="muted">Turn disciplines on or off for the practice. Each module adds its own note types, forms and chart tabs.</p></div></div>
  <div class="grid g2">
    <div class="card"><h2 style="margin-bottom:10px">Discipline modules</h2>${Object.entries(DISC).map(([k,d])=>`<div class="list-item"><span class="dot" style="background:var(--${k})"></span><span style="flex:1"><b>${d.label}</b></span><label class="toggle"><input type="checkbox" ${PRACTICE.modules[k]?"checked":""} aria-label="${d.label}" onchange="PRACTICE.modules['${k}']=this.checked;render()"><span></span></label></div>`).join("")}</div>
    <div class="card"><h2 style="margin-bottom:10px">Practice</h2>
      <div class="stack"><div class="field"><label for="pn">Practice name</label><input id="pn" class="input" value="${esc(PRACTICE.name)}"></div>
      <div class="field"><label for="tz">Time zone</label><select id="tz" class="input"><option>America/New_York</option><option>America/Chicago</option><option>America/Denver</option><option>America/Los_Angeles</option></select></div>
      <div class="list-item"><span style="flex:1">AI scribe & assist</span><span class="pill">Not connected</span></div>
      <div class="list-item"><span style="flex:1">Branding · client app accent</span><input type="color" value="#7AAFD7" aria-label="Brand color"></div></div></div>
    <div class="card"><div class="card-head"><h2>Services & fees</h2><button class="btn sm" onclick="notLive()">+ Add service</button></div>${none("No services yet.")}</div>
    <div class="card"><h2 style="margin-bottom:10px">Integrations</h2>${["Card payments","Calendar sync","Supplement ordering","Wearables","ePrescribe","eFax","API and webhooks"].map(n=>`<div class="list-item"><span style="flex:1">${n}</span><span class="pill">Not connected</span></div>`).join("")}</div>
  </div>`;

V.portal = () => {
  const tabs=[["home","Home"],["plan","My plan"],["journal","Journal"],["msgs","Messages"],["pay","Billing"]];
  const box=(t,b)=>`<div class="card" style="margin-top:10px"><b>${t}</b><div class="muted" style="font-size:13px;margin-top:4px">${b}</div></div>`;
  const scr={
    home:`<h2 style="font-family:var(--font-display);font-size:22px">Welcome</h2>${box("Next appointment","Nothing booked.")}${box("To do","Nothing to do right now.")}<button class="btn" style="width:100%;justify-content:center;margin-top:10px" onclick="notLive()">Book an appointment</button>`,
    plan:`<h2>My plan</h2>${box("Plans","Nothing has been shared with you yet.")}`,
    journal:`<h2>Journal</h2>${box("Mood","No entries yet.")}${box("Food","No photos yet.")}${box("Workouts","Nothing logged yet.")}`,
    msgs:`<h2>Messages</h2>${box("Inbox","No messages.")}`,
    pay:`<h2>Billing</h2><div class="card" style="margin-top:10px"><span class="muted" style="font-size:12px">BALANCE</span><b style="display:block;font-size:24px">$0</b><span class="muted" style="font-size:12px">No card on file</span></div>${box("Documents","No invoices or receipts yet.")}`
  };
  return `<div class="view-head"><div><h1>Client app preview</h1><p class="muted">What clients will see on web and phone</p></div></div>
  <div class="grid g2" style="align-items:start">
    <div class="phone"><div class="phone-screen">${scr[state.portalTab]}</div><div class="phone-bar">${tabs.map(([id,l])=>`<button class="btn ghost sm" style="flex-direction:column;gap:0;padding:4px 2px;min-width:0;${state.portalTab===id?"color:var(--accent-text)":""}" onclick="state.portalTab='${id}';render()">${l}</button>`).join("")}</div></div>
    <div class="card"><h2 style="margin-bottom:10px">What clients will be able to do</h2>${["Book, reschedule and cancel within your rules","Fill out intake forms, consents and measures","Join video sessions from the app","Message each provider (routed by discipline)","See their treatment, meal and workout plans","Log food photos, mood, symptoms and workouts","Pay, buy packages, download superbills","Manage care-team sharing consent"].map(x=>`<div class="list-item">${x}</div>`).join("")}</div>
  </div>`;
};

V.booking = () => `
  <div class="view-head"><div><h1>Booking page</h1><p class="muted">A public booking page and embeddable widget for the practice</p></div><button class="btn" onclick="notLive()">Copy embed code</button></div>
  <div class="card" style="max-width:640px;margin:0 auto">
    <div class="row" style="margin-bottom:16px">${["Service","Time","Details","Confirm"].map((x,i)=>`<span class="pill ${i===0?"accent":""}">${i+1}. ${x}</span>`).join("")}</div>

/* =========================================================================
   PWA install (prototype) — real install requires manifest.json + sw.js
   ========================================================================= */
function installModal(){
  modal(`<h2>Install the desktop app</h2><p class="muted">The finished product will install from the browser and open in its own window. This demonstration cannot be installed yet.</p>
  <div class="stack" style="margin:14px 0">
    <div class="list-item"><b style="width:120px">Chrome / Edge</b><span>Click the install icon (⊕) in the address bar, or open the menu and choose Install app</span></div>
    <div class="list-item"><b style="width:120px">Mac Safari</b><span>File → Add to Dock</span></div>
    <div class="list-item"><b style="width:120px">iPhone / iPad</b><span>Share → Add to Home Screen</span></div>
    <div class="list-item"><b style="width:120px">Android</b><span>Menu → Install app</span></div>
  </div>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="closeModal()">Got it</button></div>`);
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;});
$("#installBtn").addEventListener("click",()=>{ if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;} else installModal(); });

/* =========================================================================
   ROUTER + BOOT
   ========================================================================= */
function render(){
  let r=(location.hash||"#dashboard").slice(1);
  if(!V[r]) r="dashboard";
  const flag=NAV.flatMap(g=>g.items).find(i=>i[0]===r)?.[2];
  if(!navAllowed(flag)) r="dashboard";
  renderNav(r);
  $("#view").innerHTML=V[r]();
  $("#nav").classList.remove("open");
}
$("#roleSel").innerHTML=USERS.map(u=>`<option value="${u.id}">${esc(u.name)}${u.cred?", "+u.cred:""} · ${u.role}${u.disc.length?" ("+u.disc.map(d=>DISC[d].short).join("/")+")":""}</option>`).join("");
if(USERS.length<2) $("#roleSel").closest(".field").style.display="none";
$("#roleSel").addEventListener("change",e=>{state.user=e.target.value;toast("Now viewing as "+me().name);render();});
$("#navToggle").addEventListener("click",()=>$("#nav").classList.toggle("open"));
$("#themeBtn").addEventListener("click",()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";});
$("#globalSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){const q=e.target.value.toLowerCase();const c=CLIENTS.find(x=>x.name.toLowerCase().includes(q));if(c)openChart(c.id);else toast("No client matches “"+e.target.value+"”");}});
window.addEventListener("hashchange",render);
render();
</script>
</body>
