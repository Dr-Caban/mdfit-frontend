<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Fit Admin</title>
<link rel="manifest" href="/admin.webmanifest">
<meta name="theme-color" content="#0A1A2E">
<link rel="apple-touch-icon" href="assets/app-icon-192.png">
<meta name="apple-mobile-web-app-title" content="MD Fit Admin">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="MD Fit practice workspace. Staff sign-in required.">
<!-- Practice workspace: this file holds the screens' styles and shell; workspace-app.js signs in and talks to /api/admin/*. -->
<style>
/* Layout idea: calm clinical workspace — slim nav rail, dense cards, color = discipline */
:root{
  /* MD Fit brand, inverted for a workspace: the marketing site is navy with light-blue
     accents; this is white with lighter blues, and navy only for text. Values are the
     site's own tokens (styles.css). To white-label for another practice, change this block. */
  --bg:#F5F9FC; --surface:#FFFFFF; --ink:#0A1A2E; --muted:#5B6B7C; --line:#DCE8F2;
  --accent:#7AAFD7; --accent-soft:#EAF3FA; --accent-ink:#0A1A2E;
  --accent-text:#2F6E9E;   /* light blue fails contrast as text on white; this is the brand's AA blue */
  --wash:#F0F6FB;          /* the lightest blue, for hovers and quiet panels */
  --bh:#6B4FB8; --med:#C2412D; --nut:#2E8540; --fit:#C8862B; --body:#2F6E9E;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#C62828;
  --font-display:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --font-body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(10,26,46,.05),0 6px 18px -8px rgba(10,26,46,.14);
  color-scheme:light;
}
/* White with light blues is this page's look on every device. The dark set below applies only when the person
   switches to it with the toggle (remembered on that device); the device's own dark setting does not change it. */
:root[data-theme="dark"]{
  --bg:#0A1A2E; --surface:#10233B; --ink:#E8F0F7; --muted:#9BB0C4; --line:#1D3352;
  --accent:#8EC0E6; --accent-soft:#16304D; --accent-ink:#0A1A2E; --accent-text:#8EC0E6; --wash:#132A45;
  --bh:#A28BE6; --med:#EE7D68; --nut:#6CC47E; --fit:#F0A55B; --body:#8EC0E6; color-scheme:dark;}

.demo-bar{background:var(--accent-soft);color:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;font-size:12.5px;line-height:1.45;overflow-wrap:anywhere}
.signin{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(180deg,var(--accent-soft),var(--bg) 60%)}
.signin-card{width:min(380px,100%);display:grid;gap:14px;padding:26px 24px}
[hidden]{display:none!important}
/* Label and value side by side. The label column never takes more than 45%, so a long label wraps instead of
   squeezing the value into a one-letter column. */
.kv{display:grid;grid-template-columns:fit-content(45%) minmax(0,1fr);gap:6px 14px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:break-word}
/* Intake documents: questions are whole sentences, so each answer sits under its question */
.qa{margin:0;display:grid;gap:12px}
.qa dt{color:var(--muted);font-size:12.5px;margin:0 0 2px}.qa dd{margin:0;font-weight:500;overflow-wrap:break-word;white-space:pre-line}
.rec{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0}
.mv-thumb{width:64px;height:40px;object-fit:cover;border-radius:6px;background:var(--wash)}
.spin{color:var(--muted);padding:24px 0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font-body);}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.nav{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
/* The MD Fit mark is white and light blue, so it sits on the brand navy in both themes */
.logo{width:38px;height:38px;border-radius:10px;background:#0A1A2E;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo.lg{width:64px;height:64px;border-radius:14px}
.brand b{font-family:var(--font-display);font-size:18px}
.nav-group{padding:8px 10px}
.nav-group>span{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--bg)}
.nav a.active{background:var(--accent-soft);color:var(--accent-text)}
.nav a svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.nav .badge{margin-left:auto}
.nav-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line);font-size:12px}

.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 24px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.search input{border:0;background:transparent;outline:none;width:100%}
.search{position:relative}
.search-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(10,26,46,.18);z-index:60;max-height:min(70vh,520px);overflow:auto;padding:4px;min-width:260px}
.search-res button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:inherit;font:inherit}
.search-res button:hover,.search-res button.on{background:var(--accent-soft)}
/* The same field inside a card (note screen): full width, and the focus ring goes on the box since the input has none */
.search.in{flex:none;max-width:none}
.search.in input{-webkit-appearance:none;appearance:none}
.search.in:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.top .spacer{flex:1}
.view{overflow-y:auto;padding:24px;flex:1}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-head p{margin:4px 0 0}

/* Primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:600}
a.btn{text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
#roleSel{max-width:300px}
.btn.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);border-color:transparent}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:transparent}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-color:transparent}
.pill.accent{color:var(--accent-text);background:var(--accent-soft);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.disc{--c:var(--accent);color:var(--c);background:color-mix(in srgb,var(--c) 11%,transparent);border-color:transparent}
.d-bh{--c:var(--bh)}.d-med{--c:var(--med)}.d-nut{--c:var(--nut)}.d-fit{--c:var(--fit)}.d-body{--c:var(--body)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.table-wrap{overflow-x:auto}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
textarea.input{min-height:120px;resize:vertical;line-height:1.55}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 12px;border:0;background:transparent;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--accent-text);border-bottom-color:var(--accent)}
.kpi b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi small{font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border:0;background:none;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:3px solid var(--accent-text);outline-offset:-3px}
.kpi-btn{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;display:block}
.kpi-btn:hover,.kpi-btn[aria-expanded="true"]{border-color:var(--accent)}
.kpi-btn:focus-visible,.pill-btn:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.kpi-more{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--accent-text);font-weight:600}
.kpi-btn[aria-expanded="true"] .kpi-more svg{transform:rotate(90deg)}
.pill-btn{font:inherit;font-size:12px;cursor:pointer}
.pill-btn:disabled{cursor:default}
.pill-btn:not(:disabled):hover{border-color:var(--accent)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .pill{white-space:normal;text-align:right}
.toggle{position:relative;width:36px;height:20px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:absolute;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s}
.toggle span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{left:18px}
.locked{border:1px dashed var(--line);border-radius:8px;padding:14px;display:flex;gap:10px;align-items:flex-start;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--muted) 5%,transparent) 8px 16px)}
.locked svg{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.8;margin-top:2px}
.tier{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;border:1px solid currentColor}
.t0{color:var(--muted)}.t1{color:var(--accent-text)}.t2{color:var(--warn)}.t3{color:var(--bad)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* Calendar */
.cal{display:grid;grid-template-columns:56px repeat(7,minmax(104px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:820px}
.cal-h{padding:10px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px;border-left:1px solid var(--line)}
.cal-h.today{color:var(--accent-text)}
.cal-times{display:grid;grid-template-rows:repeat(28,28px)}
.cal-times div{font-size:11px;color:var(--muted);padding:0 6px;text-align:right;transform:translateY(-7px)}
.cal-col{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 55px,var(--line) 55px 56px)}
.appt{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:12px;line-height:1.3;cursor:pointer;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--surface));contain:paint;overflow-wrap:anywhere}
.btn.mic.rec{background:var(--bad);color:#fff;border-color:transparent}
.ui-ic{flex:none;display:block}
.chip{font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.bc-list{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px}
.stars{display:inline-flex;gap:1px;color:var(--warn);vertical-align:-2px}
/* Video visit stage: the patient large, your own picture small in the corner */
.tele-stage{position:relative;aspect-ratio:16/9;background:#0A1A2E;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.tele-stage video{display:block;background:#0A1A2E}
.tele-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:2px;visibility:hidden}
.tele-stage.has-remote .tele-grid{visibility:visible}
.tele-grid .tile{position:relative;min-height:0;min-width:0;background:#0A1A2E}
.tele-grid .tile video{width:100%;height:100%;object-fit:contain}
.tele-grid .tile span{position:absolute;left:8px;bottom:8px;background:rgba(10,26,46,.72);color:#fff;padding:2px 8px;border-radius:6px;font-size:12px;max-width:80%;overflow-wrap:anywhere}
#teleLocal{position:absolute;right:12px;bottom:12px;width:22%;min-width:96px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.7);display:none}
.tele-stage.live #teleLocal{display:block}
.tele-timer,.tele-who{position:absolute;left:12px;background:rgba(10,26,46,.72);color:#fff;padding:4px 9px;border-radius:7px;font-size:12.5px;display:none}
.tele-timer{top:12px;font-variant-numeric:tabular-nums}.tele-who{bottom:12px;max-width:60%;overflow-wrap:anywhere}
.tele-stage.live .tele-timer,.tele-stage.live .tele-who{display:block}
.tele-idle{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;color:#E8F0F7;padding:20px}
.tele-idle span{color:#9BB0C4;font-size:13px;max-width:36ch}
.tele-avatar{position:absolute;inset:0;display:none;place-content:center;justify-items:center;gap:8px;color:#9BB0C4}
.tele-avatar span{color:#E8F0F7;font-weight:600}
.tele-stage.live:not(.has-remote) .tele-avatar{display:grid}
.tele-stage.live .tele-who{bottom:auto;top:44px}
/* Live room, the host's view: your own picture fills the stage (it is what the room sees) and each speaker is a
   bubble stacked up the right-hand side */
.tele-stage.room #teleLocal{inset:0;width:100%;height:100%;min-width:0;aspect-ratio:auto;object-fit:contain;border:0;border-radius:0}
.tele-stage.room .tele-grid{inset:auto 12px 12px auto;width:22%;min-width:104px;max-height:calc(100% - 72px);display:flex;flex-direction:column-reverse;gap:8px;overflow-y:auto;visibility:visible;z-index:2}
.tele-stage.room .tele-grid .tile{flex:none;aspect-ratio:4/3;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.8)}
.tele-stage.room .tele-grid .tile video{object-fit:cover}
.tele-stage.room .tele-avatar{display:none!important}
.tele-stage.room .tele-timer,.tele-stage.room .tele-who{z-index:3}
#teleBoard{position:absolute;inset:0;width:100%;height:100%;background:rgba(255,255,255,.94);touch-action:none;cursor:crosshair}
.tele-clear{position:absolute;right:12px;top:12px}
.tele-chat{margin-top:12px;display:grid;gap:10px}
.tele-chat-list{max-height:220px;overflow:auto;display:grid;gap:6px;align-content:start}
.tele-chat-list .bubble{max-width:85%;justify-self:start}.tele-chat-list .bubble.me{justify-self:end}
.vwrap{position:relative;display:inline-grid}
.vdot{position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.vbtn{color:var(--ink)}.vbtn:disabled{opacity:.45;cursor:default}
.vbtn:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.vbtn.end{font-weight:700;font-size:13px}
.appt b{display:block;font-weight:600}
/* Busy on another calendar: times only, drawn behind MD Fit's own visits and not clickable */
.appt.busy{--c:var(--muted);left:2px;right:2px;cursor:default;color:var(--muted);border-left-style:dashed;background:repeating-linear-gradient(135deg,var(--wash) 0 7px,color-mix(in srgb,var(--muted) 10%,var(--surface)) 7px 14px)}
.appt.busy:hover{filter:none}
.appt:hover{filter:brightness(.97)}

/* Chat */
.chat{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:calc(100vh - 190px);height:calc(100dvh - 190px);min-height:300px;overflow:hidden}
.threads,.msgs,.msg-list{min-height:0}.msgs{min-width:0}
.threads{border-right:1px solid var(--line);overflow-y:auto}
.thread{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.thread.active{background:var(--accent-soft)}
.msgs{display:flex;flex-direction:column}
.msg-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:70%;padding:9px 12px;border-radius:12px;background:var(--bg);overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

/* Telehealth */
.video{position:relative;background:#0A1A2E;border-radius:14px;aspect-ratio:16/9;overflow:hidden;display:grid;place-items:center;color:#cfe}
.video .self{position:absolute;right:14px;bottom:14px;width:22%;aspect-ratio:16/10;border-radius:10px;background:#244;display:grid;place-items:center;font-size:12px;border:2px solid rgba(255,255,255,.2)}
.video .label{position:absolute;left:14px;bottom:14px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:6px;font-size:12px}
.video .timer{position:absolute;left:14px;top:14px;background:rgba(0,0,0,.45);padding:3px 9px;border-radius:6px;font-size:12px}
.vcontrols{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.vbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.vbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vbtn.end{background:var(--bad);color:#fff;border-color:var(--bad);width:64px;border-radius:22px}
.vbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Phone */
.phone{width:320px;max-width:100%;border-radius:36px;border:10px solid #0A1A2E;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);margin:0 auto}
.phone-screen{height:620px;overflow-y:auto;padding:18px 16px}
.phone-bar{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:10px 0;background:var(--surface);font-size:11px;color:var(--muted)}

/* Forms builder */
.palette button{width:100%;justify-content:flex-start}
.canvas-field{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);display:flex;gap:10px;align-items:flex-start}
.canvas-field .grip{color:var(--muted);cursor:grab;user-select:none}

/* Modal + toast */
.modal-back{position:fixed;inset:0;background:rgba(10,26,46,.45);display:none;place-items:center;z-index:50;padding:16px}
.modal-back.open{display:grid}
.modal.wide{max-width:820px}
.set-row{display:grid;grid-template-columns:minmax(0,2fr) 84px 96px;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.set-row .wide{grid-column:1/-1}
.set-row.three{grid-template-columns:minmax(0,2fr) minmax(0,1fr) 90px;border:0;padding:6px 0 0}
.chart-types{gap:8px 10px;margin:-4px 0 14px;font-size:13px;color:var(--muted)}
.chart-types select{width:auto;min-height:36px;padding:6px 10px}
.tier-pick,select.tier-pick{width:auto;min-width:130px;max-width:100%;min-height:34px;padding:4px 8px;font-size:13px;color:var(--muted)}
.member-row{flex-wrap:wrap}.member-row .who{flex:1 1 170px;min-width:0}.member-row select.tier-pick{flex:0 1 210px}
.eco-row{grid-template-columns:minmax(0,2fr) 128px 112px}
.eco-chart{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--eco-h:230px}
:root[data-theme="dark"] .eco-chart{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.eco-chart .s1{background:var(--s1)}.eco-chart .s2{background:var(--s2)}.eco-chart .s3{background:var(--s3)}
.eco-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.eco-key{display:inline-flex;align-items:center;gap:6px}.eco-key i,.eco-tip i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.eco-plot{display:flex;gap:8px}
.eco-y{display:flex;flex-direction:column;justify-content:space-between;height:calc(var(--eco-h) + 14px);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto;margin:-7px 0}
.eco-y span{line-height:14px}
.eco-area{position:relative;flex:1;min-width:0;height:var(--eco-h);display:flex;margin-bottom:36px}
.eco-area:hover .eco-g:not(:hover) .eco-tip{display:none}
.eco-grid{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.eco-g{position:relative;flex:1;min-width:0;display:flex;justify-content:center;border-radius:6px;outline:0}
.eco-g:hover,.eco-g:focus-visible{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.eco-g:focus-visible{box-shadow:inset 0 0 0 2px var(--accent-text)}
.eco-cols{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;width:100%;padding:0 4px;position:relative}
.eco-bar{flex:0 1 24px;min-width:3px;border-radius:4px 4px 0 0}
.eco-tip{display:none;position:absolute;z-index:5;top:6px;left:calc(50% + 8px);min-width:178px;padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12.5px;color:var(--muted);pointer-events:none}
.eco-g.late .eco-tip{left:auto;right:calc(50% + 8px)}
.eco-g:hover .eco-tip,.eco-g:focus .eco-tip{display:grid;gap:4px}
.eco-tip>b{color:var(--ink)}.eco-tip span{display:flex;align-items:center;gap:6px;white-space:nowrap}.eco-tip span b{color:var(--ink)}
.eco-tip .eco-left{border-top:1px solid var(--line);padding-top:5px;margin-top:2px}
.eco-g{cursor:pointer}.eco-g[aria-expanded="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.eco-hint{font-size:11.5px;color:var(--accent-text)}
.eco-tr{cursor:pointer}.eco-tr:hover td,.eco-tr[aria-expanded="true"] td{background:var(--accent-soft)}.eco-tr:focus-visible{outline:3px solid var(--accent-text);outline-offset:-3px}
.eco-m{position:absolute;top:calc(100% + 6px);left:0;right:0;text-align:center;font-size:11.5px;line-height:14px;color:var(--muted);white-space:nowrap}.eco-m small{display:block;font-size:10.5px}
/* "+" quick actions: one round button in reach on every screen, and the menu it opens */
.qa{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:39}
.qa-btn{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px -6px rgba(10,26,46,.45);padding:0;flex:none}
.qa-btn:hover{filter:brightness(1.06)}
.qa-btn:focus-visible{outline:3px solid var(--accent-text);outline-offset:3px}
.qa-btn svg{transition:transform .15s}
.qa-btn[aria-expanded="true"] svg{transform:rotate(45deg)}
.qa-btn.docked{width:32px;height:32px;box-shadow:none}
.qa-btn.docked svg{width:17px;height:17px}
.qa-menu{position:fixed;z-index:46;width:330px;max-width:calc(100vw - 16px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px -10px rgba(10,26,46,.4);padding:6px}
.qa-head{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:6px 10px;min-height:40px}
.qa-head .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qa-row,.qa-opt{display:flex;width:100%;gap:11px;align-items:center;text-align:left;padding:9px 10px;border:0;background:none;border-radius:9px;cursor:pointer;color:inherit;font:inherit}
.qa-row:hover,.qa-row:focus-visible,.qa-opt:hover,.qa-opt.on{background:var(--accent-soft)}
.qa-row:focus-visible,.qa-opt:focus-visible{outline:2px solid var(--accent-text);outline-offset:-2px}
.qa-row svg{width:19px;height:19px;flex:none;stroke:var(--accent-text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qa-row span,.qa-opt span:last-child{min-width:0;flex:1}
.qa-row small,.qa-opt small{display:block;color:var(--muted);font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.qa-find{margin:0 6px 6px}
.qa-note{margin:6px 10px;font-size:12px;color:var(--muted)}.qa-note:empty{display:none}
.view.fab-pad{padding-bottom:92px}
body:has(#modalBack.open) .qa{display:none}
/* an on/off switch (the guide's AI answers) */
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-ink)}
.switch:disabled{opacity:.5;cursor:not-allowed}
.switch:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
/* a graph with many columns (a month of days) gives each one less padding */
.eco-chart.dense .eco-cols{padding:0 1px;gap:1px}
/* the guide's graph: the first and last dates stay inside the plot, and on a narrow screen the box of numbers
   slides along with the column so it never runs off either side */
#guideChart .eco-g:last-child .eco-m{left:auto;right:0}#guideChart .eco-g:first-child .eco-m{right:auto}
@media (max-width:820px){#guideChart .eco-g .eco-tip{left:50%;right:auto;transform:translateX(calc(var(--f,.5) * -100%))}#guideChart .eco-m.thin{display:none}}
#refreshBtn{position:relative}#refreshBtn.spin svg{animation:turn .6s linear}
@keyframes turn{to{transform:rotate(360deg)}}
.live-dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 2px var(--surface)}
.live-dot.off{background:var(--warn)}
#netbar{position:fixed;top:0;left:0;right:0;height:2px;z-index:300;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,var(--accent),transparent) no-repeat;background-size:40% 100%}
#netbar.on{opacity:1;animation:netbar 1s linear infinite}
@keyframes netbar{from{background-position:-70% 0}to{background-position:170% 0}}
[aria-busy="true"]{cursor:progress}
.btn[aria-busy="true"],form[aria-busy="true"] button:not([type="button"]){animation:busy 1s .15s ease-in-out infinite}
@keyframes busy{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){#netbar.on{animation:none;background:var(--accent)}.btn[aria-busy="true"],form[aria-busy="true"] button:not([type="button"]){animation:none;opacity:.6}}
.tier-pick.on{color:var(--ok);font-weight:600;border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.doc{color:#111;background:#fff;padding:18px;border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.45}
.doc-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}
.doc-t{width:100%;border-collapse:collapse;margin:0 0 14px}
.doc-t th,.doc-t td{border:1px solid #c9d3dd;padding:6px 8px;text-align:left;vertical-align:top;color:#111}
.doc-t th{background:#f2f6fa;font-weight:600;white-space:nowrap}
.doc-fine{font-size:11.5px;color:#333}.doc-fine p{margin:6px 0}
.doc-line{display:grid;grid-template-columns:1.1fr .8fr 1.6fr .8fr;gap:6px;margin-top:6px}
#printDoc{display:none}
@media print{body>*{display:none!important}body>#printDoc{display:block!important}#printDoc .doc{border:0;padding:0}}
@media (max-width:640px){.doc-line{grid-template-columns:1fr 1fr}.doc-top{flex-direction:column}}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow-y:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60;font-weight:500;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.mobile-nav-btn{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:1fr}}
.form-grid{grid-template-columns:200px minmax(0,1fr) 260px}
.form-grid>*{min-width:0}
.main,.view{min-width:0}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)!important}
  .view>*{max-width:100%}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .card{overflow-x:auto}
  .table-wrap{overflow-x:auto;max-width:100%}
  .app{grid-template-columns:1fr}
  .nav{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:.2s}
  .nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .mobile-nav-btn{display:inline-flex}
  .g2,.g3,.g4,.g-side{grid-template-columns:minmax(0,1fr)}
  .chat{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .threads{display:flex;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  .thread{flex:0 0 210px;border-bottom:0;border-right:1px solid var(--line)}
  .view{padding:16px}.top{padding:10px 16px}
  .qa{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<section class="signin" id="signin">
  <form class="card signin-card" id="signinForm" novalidate>
    <div class="brand" style="padding:0 0 6px"><div class="logo lg"><img src="assets/logo.webp" alt="" width="160" height="160"></div><div><b>MD Fit</b><div class="muted" style="font-size:12px">Physical Rehab &amp; Fitness</div></div></div>
    <h1 style="font-size:24px">Admin</h1>
    <div class="field"><label for="siEmail">Email</label><input id="siEmail" name="email" type="email" class="input" required autocomplete="username"></div>
    <div class="field"><label for="siPass">Password</label><input id="siPass" name="password" type="password" class="input" required autocomplete="current-password"></div>
    <div class="field" id="siCodeRow" hidden><label for="siCode">Code from your email</label><input id="siCode" name="code" class="input" inputmode="numeric" autocomplete="one-time-code"></div>
    <button class="btn primary" style="justify-content:center">Sign in</button>
    <p class="muted" id="siMsg" role="status" style="margin:0;min-height:1.2em"></p>
  </form>
</section>
<div class="app" id="app" hidden>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="main">
    <header class="top">
      <button class="btn ghost mobile-nav-btn" id="navToggle" aria-label="Open menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="globalSearch" placeholder="Find a client by name or email" aria-label="Find a client" autocomplete="off" role="combobox" aria-controls="globalRes" aria-expanded="false"><div id="globalRes" class="search-res" role="listbox" hidden></div></div>
      <div class="spacer"></div>
      <span class="muted" id="whoami" style="font-size:12.5px"></span>
      <button class="btn sm" id="installBtn" hidden><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>Install app</button>
      <button class="btn ghost sm" id="refreshBtn" aria-label="Refresh" title="Refresh"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.300-5.600"/><path d="M20 4v4h-4"/></svg><span class="live-dot" id="liveDot" aria-hidden="true"></span></button>
      <button class="btn sm" id="signOut">Sign out</button>
      <button class="btn ghost sm" id="themeBtn" aria-label="Switch between light and dark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <div class="qa" id="qa"><button type="button" class="qa-btn" id="qaBtn" data-act="qaToggle" aria-label="Quick actions: invoice, telehealth, booking, note, forms, program, message" title="Quick actions" aria-haspopup="true" aria-expanded="false" aria-controls="qaMenu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="qa-menu" id="qaMenu" role="dialog" aria-label="Quick actions" hidden></div>
</div>
<div class="modal-back" id="modalBack"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="netbar" aria-hidden="true"></div>

<div id="printDoc"></div>
<script src="config.js?v=aac711e3"></script>
<script src="realtime.js?v=22ae7ae5"></script>
<script src="app/exercises.js?v=d121be98"></script>
<script src="workspace-app.js?v=c7d5ed74"></script>
</body>
