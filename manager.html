<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Fit Manager</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1A2E">
<meta name="description" content="MD Fit Online manager console. Staff sign-in required.">
<link rel="apple-touch-icon" href="assets/app-icon-192.png">
<!-- The manager's console (Junior Partnership, Platform & EMR Agreement, Revision 2): the revenue share, payment
     notices, monthly statements, PATF partners and the manager's own Stripe payouts account. Signs in with a staff
     account that has the Manager role. It never shows patient data (Section 11.2): the API sends amounts and
     products only. The owner's workspace is /admin. -->
<style>
:root{
  --bg:#F5F9FC; --surface:#FFFFFF; --ink:#0A1A2E; --muted:#5B6B7C; --line:#DCE8F2;
  --accent:#7AAFD7; --accent-soft:#EAF3FA; --accent-text:#2F6E9E; --wash:#F0F6FB;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#C62828; --gold:#C8A763;
  --font-display:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --font-body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(10,26,46,.05),0 6px 18px -8px rgba(10,26,46,.14);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0A1A2E; --surface:#10233B; --ink:#E8F0F7; --muted:#9BB0C4; --line:#1D3352;
  --accent:#8EC0E6; --accent-soft:#16304D; --accent-text:#8EC0E6; --wash:#132A45; --ok:#6CC47E; --warn:#F0A55B; --bad:#EE7D68; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
body{overflow-wrap:anywhere}
a{color:var(--accent-text)}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font:700 16px var(--font-display);white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px}
.top .who{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font:600 14px var(--font-body);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}.seg a{padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap}.seg a+a{border-left:1px solid var(--line)}.seg a:hover{color:var(--ink)}.seg a[aria-current]{background:var(--accent-soft);color:var(--accent-text)}
@media (max-width:760px){.top{flex-wrap:wrap}.seg{order:9;display:flex;width:100%}.seg a{flex:1;text-align:center;padding:7px 4px}}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.icon{width:36px;height:36px;padding:0;border-radius:50%}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--muted);font:600 14px var(--font-body);padding:10px 12px;border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent-text);border-bottom-color:var(--accent-text)}
h1{font:700 24px/1.25 var(--font-display);margin:0 0 4px}
h2{font-size:16px;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:760px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.top .who span{display:none}}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi small{color:var(--muted);font-size:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--wash);color:var(--muted);white-space:nowrap}
.pill.ok{background:rgba(46,125,79,.12);color:var(--ok)}
.pill.warn{background:rgba(183,121,31,.14);color:var(--warn)}
.pill.bad{background:rgba(198,40,40,.12);color:var(--bad)}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);vertical-align:top}
.table-wrap table{min-width:760px}
th,td{overflow-wrap:normal;word-break:normal}
td .muted.small{white-space:nowrap}
td:first-child{white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12.5px;border-top:0;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.notice{border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;background:var(--surface)}
.notice.new{border-color:var(--gold);background:var(--wash)}
.notice p{margin:6px 0 10px}
.field{display:grid;gap:5px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600}
.input,select{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:9px 11px;font:15px var(--font-body)}
.input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.msg{min-height:1.2em;font-size:13px;margin:6px 0 0}
.msg.err{color:var(--bad)}
.signin{max-width:380px;margin:9vh auto 0}
.signin h1{text-align:center;margin-bottom:6px}
.signin p.muted{text-align:center;margin:0 0 18px}
.code{font:600 13px ui-monospace,Menlo,monospace;background:var(--wash);border-radius:6px;padding:2px 6px}
.stripe-mount{min-height:300px}
.empty{color:var(--muted);padding:14px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:all .2s;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/app-icon-192.png" alt=""><div><b>MD Fit Manager</b><small>MD Fit Online LLC</small></div></div>
  <div class="who" id="who" hidden><span id="whoName"></span></div>
  <button class="btn icon" id="themeBtn" type="button" aria-label="Switch light or dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <nav class="seg" id="switch" aria-label="Switch console" hidden></nav>
  <button class="btn sm" id="signOut" type="button" hidden>Sign out</button>
</header>
<main>
  <section id="signin" class="signin" hidden>
    <h1>Manager sign-in</h1>
    <p class="muted">For the Manager staff account. The practice workspace is at <a href="/workspace">/admin</a>.</p>
    <form class="card" id="signinForm" novalidate>
      <div class="field"><label for="siEmail">Email</label><input id="siEmail" name="email" class="input" type="email" autocomplete="username" required></div>
      <div class="field"><label for="siPass">Password</label><input id="siPass" name="password" class="input" type="password" autocomplete="current-password" required></div>
      <div class="field" id="siCodeRow" hidden><label for="siCode">6-digit code from your email</label><input id="siCode" name="code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div>
      <button class="btn primary" style="width:100%" type="submit">Sign in</button>
      <div id="siGoogleWrap" hidden><p class="muted" style="text-align:center;font-size:12px;margin:10px 0 8px">or</p><div id="siGoogle" style="display:flex;justify-content:center;min-height:44px"></div></div>
      <p class="msg" id="siMsg" role="status"></p>
    </form>
  </section>
  <section id="app" hidden>
    <nav class="tabs" role="tablist" aria-label="Manager console">
      <button class="tab" role="tab" data-tab="share" aria-selected="true">Revenue share</button>
      <button class="tab" role="tab" data-tab="statement" aria-selected="false">Statements</button>
      <button class="tab" role="tab" data-tab="partners" aria-selected="false">Partners (PATF)</button>
      <button class="tab" role="tab" data-tab="payouts" aria-selected="false">Payouts account</button>
    </nav>
    <div id="view" aria-live="polite"></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="config.js?v=aac711e3"></script>
<script src="manager.js?v=c0f7c2d5"></script>
</body>
</html>
